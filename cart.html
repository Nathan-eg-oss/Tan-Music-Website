<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tan Music | Your Cart</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <style>
    body {
      background-color: #fff;    
      color: #000;
      min-height: 100vh;
    }
    .cart-container {
      max-width: 600px;
      margin: 100px auto;
      padding: 30px;
      background-color: #000;   
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
      color: #fff;              
    }
    .btn-back {
      margin-top: 20px;
      background-color: #fff;   
      border: 1px solid #000;
      color: #000;               
    }
    .btn-back:hover {
      background-color: #000;
      color: #fff;
    }
    .cart-icon {
      font-size: 80px;
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="cart-container text-center">
    <i class="fas fa-shopping-cart cart-icon mb-4"></i>
    <h2>Your Cart is Empty</h2>
    <p class="mb-4">Looks like you haven’t added anything yet.</p>
    <a href="index.html" class="btn btn-back">Continue Shopping</a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
