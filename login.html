<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tan Music | Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: white;
    }
    .form-box {
      background-color: #111;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(0,0,0,0.2);
      max-width: 400px;
      margin: 80px auto;
      color: white;
    }
    .form-control {
      background-color: black;
      color: white;
      border: 1px solid white;
    }
    .form-control::placeholder {
      color: #aaa;
    }
    .nav-tabs {
      border-bottom: none;
      justify-content: center;
      margin-top: 20px;
    }
    .nav-tabs .nav-link {
      color: white;
      border: none;
      background: transparent;
    }
    .nav-tabs .nav-link.active {
      background-color: white;
      color: black;
      border-radius: 5px;
    }
    .btn-custom {
      background-color: white;
      color: black;
      border: none;
      width: 100%;
      text-align: center;
      display: inline-block;
      padding: 10px;
      border-radius: 5px;
      cursor: pointer;
    }
    .btn-custom:hover {
      background-color: #ccc;
    }
    .tab-content {
      animation: slide-in 0.5s ease;
    }
    @keyframes slide-in {
      from { opacity: 0; transform: translateX(50px); }
      to { opacity: 1; transform: translateX(0); }
    }
    .message {
      background-color: #222;
      color: #0f0;
      padding: 10px;
      border-radius: 5px;
      text-align: center;
      margin-top: 15px;
    }
  </style>
</head>
<body>

<div class="form-box">
  <div class="tab-content">

    
    <div class="tab-pane fade show active" id="login" role="tabpanel">
      <h4 class="text-center mb-3">Login</h4>
      <form action="index.html">
        <input type="email" class="form-control mb-3" placeholder="Email" required>
        <input type="password" class="form-control mb-3" placeholder="Password" required>
        <button type="submit" class="btn-custom">Login</button>
      </form>
    </div>

    
    <div class="tab-pane fade" id="register" role="tabpanel">
      <h4 class="text-center mb-3">Create Account</h4>
      <form action="login.html">
        <input type="text" class="form-control mb-3" placeholder="Full Name" required>
        <input type="email" class="form-control mb-3" placeholder="Email" required>
        <input type="password" class="form-control mb-3" placeholder="Password" required>
        <button type="submit" class="btn-custom">Register</button>
      </form>
    </div>

    
    <div class="tab-pane fade" id="forgot" role="tabpanel">
      <h4 class="text-center mb-3">Reset Password</h4>
      <form onsubmit="return false">
        <input type="email" class="form-control mb-3" placeholder="Email" required>
        <input type="text" class="form-control mb-3" placeholder="Phone Number" required>
        <button type="submit" class="btn-custom" onclick="document.getElementById('reset-message').style.display='block'">Send Reset Link</button>
      </form>
      <div class="message" id="reset-message" style="display:none;">
        Successfully sent reset code! Check your Gmail or phone.
      </div>
    </div>
  </div>
 

  <ul class="nav nav-tabs mt-4" id="myTab" role="tablist">
    <li class="nav-item" role="presentation">
      <button class="nav-link active" id="login-tab" data-bs-toggle="tab" data-bs-target="#login" type="button">Login</button>
    </li>
    <li class="nav-item" role="presentation">
      <button class="nav-link" id="register-tab" data-bs-toggle="tab" data-bs-target="#register" type="button">Create Account</button>
    </li>
    <li class="nav-item" role="presentation">
      <button class="nav-link" id="forgot-tab" data-bs-toggle="tab" data-bs-target="#forgot" type="button">Forgot Password</button>
    </li>
  </ul>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
