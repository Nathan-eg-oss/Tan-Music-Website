<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tan Music | Added to Cart</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <style>
    body {
      background-color: #fff;
      color: #000;
      min-height: 100vh;
    }
    .message-container {
      max-width: 600px;
      margin: 100px auto;
      padding: 30px;
      background-color: #000;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
      color: #fff;
      text-align: center;
    }
    .check-icon {
      font-size: 80px;
      color: #28a745;
      margin-bottom: 20px;
    }
    .btn-back {
      margin-top: 20px;
      background-color: #fff;
      border: 1px solid #000;
      color: #000;
      text-decoration: none;
      padding: 10px 20px;
      display: inline-block;
      border-radius: 5px;
      transition: background-color 0.3s;
    }
    .btn-back:hover {
      background-color: #000;
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="message-container">
    <i class="fas fa-check-circle check-icon"></i>
    <h2>Item Successfully Added</h2>
    <p class="mb-4">Your item has been added to the cart.</p>
    <a href="index.html" class="btn-back">Continue Shopping</a>
  </div>
</body>
</html>
